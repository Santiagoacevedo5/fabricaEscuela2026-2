server.port=8080
spring.application.name=proyecto

# Configuración de base de datos PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/empresa

# Cambia "postgres" y tu contraseña real si no usas variables de entorno
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creación/Actualización automática de tablas en PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
#Lo uso para verificar errores en el Postman